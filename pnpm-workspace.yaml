packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency install scripts by default. Only packages that need to
# build or link a native binary are allowed through; everything else stays
# blocked, which keeps the install-time execution surface as small as it can be.
#
# Deliberately NOT listed, though pnpm reports them as ignored:
#   @tsparticles/engine - its install script only prints a thank-you banner
#   core-js-pure        - its postinstall only prints a donation notice
# Both are pure JavaScript and work correctly with their scripts blocked.
onlyBuiltDependencies:
  - '@swc/core'
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver

# @strapi/admin 5.50.0 pins @strapi/design-system to exactly 2.2.1, whose dist
# *inlines* a copy of @codemirror/state while importing @codemirror/lang-json as
# an external. lang-json brings the standalone @codemirror/state, so the admin
# loads two copies: the JSON editor builds its extensions from one and calls
# EditorState.create from the other, `instanceof` fails, and every content-manager
# view holding a JSON field dies with "Unrecognized extension value in extension
# set". The SEO component's structuredData put a JSON field on most types here,
# which made that most of the content manager — until 0011-seo-sheds-its-unread-fields.md
# shed it. The schema now declares no JSON field at all, so nothing currently
# triggers the crash. The override stays anyway: the trigger returns with the next
# JSON field anyone adds, and dropping it has not been verified against the admin.
#
# 2.2.3 imports @codemirror/state and @codemirror/view rather than inlining them,
# which collapses it back to one instance. Patch-level bump; remove this override
# once @strapi/admin ships a design-system that does not inline.
overrides:
  '@strapi/design-system': 2.2.3

# apps/strapi already declares `engines: node >=18.0.0 <=22.x.x`, and .nvmrc
# pins 22, but pnpm only warned — so an install on a newer Node got as far as
# building better-sqlite3 from source and failed with a node-gyp error demanding
# Visual Studio, which points nowhere near the real cause. Failing the install
# outright turns a thirty-minute diagnosis into a one-line one. Raise the ceiling
# in apps/strapi when Strapi itself supports a newer Node.
engineStrict: true
