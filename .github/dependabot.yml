# Keeps dependency and action pins current without a flood of PRs: weekly,
# grouped, capped. Titles follow Conventional Commits so the conventions
# check passes on Dependabot's PRs too.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Pinned together on purpose (see #13): they move as one.
      next:
        patterns: ["next", "eslint-config-next"]
      # three is 0.x, so a minor bump can break the hero scene, and the R3F
      # packages track its version. Own group keeps them out of
      # minor-and-patch and reviewable together.
      three:
        patterns: ["three", "@types/three", "@react-three/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          ["next", "eslint-config-next", "three", "@types/three", "@react-three/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
