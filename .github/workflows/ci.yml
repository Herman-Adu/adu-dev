name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A superseded run on the same PR is wasted minutes, so PRs share one group
# per PR and cancel. Every push to main gets its own group (run_id): GitHub
# keeps only one *pending* run per group, so a shared group would silently
# drop the middle commit's run and leave it with no record.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# PR title and branch name are checked in conventions.yml, which also runs on
# title edits without re-running this build.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node as every developer machine: .nvmrc is the single source.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Type errors fail the build by design; this surfaces them first and
      # fastest, before the slower steps run.
      - name: Typecheck
        run: npm run typecheck

      # The rules that pass tsc and next build while still being wrong.
      - name: House rules
        run: npm run house-rules

      # CONTENT_SOURCE=local must always work with no back end running.
      # Building under it is what keeps that promise true.
      - name: Build (local content source)
        run: npm run build
        env:
          CONTENT_SOURCE: local

      # Lint joins this list once #16 clears forge-scene.tsx.
