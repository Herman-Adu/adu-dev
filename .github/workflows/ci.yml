name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A superseded run on the same PR is wasted minutes. Runs on main are never
# cancelled: each one is the record for the commit it tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Title and branch come in through env, never inlined into the script:
      # a PR title is user input.
      - name: PR title and branch name
        run: node scripts/check-conventions.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node as every developer machine: .nvmrc is the single source.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Type errors fail the build by design; this surfaces them first and
      # fastest, before the slower steps run.
      - name: Typecheck
        run: npm run typecheck

      # The rules that pass tsc and next build while still being wrong.
      - name: House rules
        run: npm run house-rules

      # CONTENT_SOURCE=local must always work with no back end running.
      # Building under it is what keeps that promise true.
      - name: Build (local content source)
        run: npm run build
        env:
          CONTENT_SOURCE: local

      # Lint joins this list once #16 clears forge-scene.tsx.
